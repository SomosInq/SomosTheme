name: Theme quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript tooling
        run: npm ci

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@latest

      - name: Check theme
        run: npm run check:theme

      - name: Check JavaScript syntax
        run: npm run check:javascript

      - name: Check JSON syntax
        run: npm run check:json

      - name: Check formatting
        run: npm run check:format
